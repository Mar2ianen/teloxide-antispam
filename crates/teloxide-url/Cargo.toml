[package]
name = "teloxide-url"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small URL and Telegram reference extraction helpers, with an opt-in teloxide adapter"
repository = "https://github.com/Mar2ianen/teloxide-antispam"
readme = "README.md"

[features]
default = []
teloxide = ["dep:teloxide"]

[dependencies]
url = "2.5"
linkify = "0.11"
teloxide = { git = "https://github.com/Mar2ianen/teloxide-fork", rev = "ce840d82daf47c3e9b9ee16fb05d62fbe0c24727", default-features = false, optional = true, features = ["rich-text"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
