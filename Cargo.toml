[package]
name = "teloxide-antispam"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Shared anti-spam core for teloxide-based community bots: text utils, profile/message scoring signals, external reputation clients"
repository = "https://github.com/Mar2ianen/teloxide-antispam"
readme = "README.md"
keywords = ["telegram", "teloxide", "antispam", "moderation"]
categories = ["text-processing"]

[features]
default = ["scoring", "classifier", "embedding"]
unicode = ["dep:regex", "dep:unicode-normalization", "dep:unicode-properties", "dep:unicode-script"]
classifier = ["unicode", "dep:anyhow"]
embedding = ["dep:anyhow"]
scoring = ["unicode", "dep:anyhow", "dep:chrono"]
cas = ["dep:reqwest", "dep:tracing"]

[[example]]
name = "score_text"
required-features = ["classifier", "embedding"]

[lib]
name = "teloxide_antispam"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query"], optional = true }
tracing = { version = "0.1", optional = true }
regex = { version = "1", optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"], optional = true }
unicode-script = { version = "=0.5.8", optional = true }

[dev-dependencies]
base64 = "0.22"
