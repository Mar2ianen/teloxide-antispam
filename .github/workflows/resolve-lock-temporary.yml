name: Resolve review Cargo.lock
on: [push]
permissions:
  contents: write
jobs:
  export-lock:
    if: github.ref == 'refs/heads/compat/teloxide-10-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Resolve changed graph
        run: cargo metadata --format-version=1 --all-features --no-deps >/dev/null && cargo update -w
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-cargo-lock
          path: Cargo.lock
          retention-days: 1
      - name: Commit resolved lockfile to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: resolve Cargo.lock for Teloxide Bot API 10.5"
            git push origin HEAD:compat/teloxide-10-5
          fi
